[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Форма отправляется на /api/contact → функция → Telegram
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
